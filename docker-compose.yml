version: '3.8'

services:
  web:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      # DB 파일 영속화 (선택사항)
      - ./data:/app/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped



